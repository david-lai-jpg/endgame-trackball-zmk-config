CONFIG_LOG_MAX_LEVEL=3
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=2700000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2700000
CONFIG_POINTER_2S_MIXER_ENSURE_SYNC=y

# Keep simultaneous holds working with the personal six hold-tap buttons.
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=4
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=12

# TEST 2026-11-07: macOS turns every wheel report into one 1-line step while the
# HID descriptor declares a Resolution Multiplier. Check whether macOS keeps the
# report value when the multiplier is not declared.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n
